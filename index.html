<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e9dfc8" />
  <meta name="description" content="个人音乐作品展示空间 · 复古卡通收音机播放器" />
  <title>My Little Radio</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="site-header" id="siteHeader" aria-label="站点标识">
      <div class="plaque">
        <span class="rope rope-left" aria-hidden="true"></span>
        <span class="rope rope-right" aria-hidden="true"></span>
        <a class="brand" aria-label="返回音乐主页">
          <img id="siteLogo" src="assets/logo/logo.png" alt="个人音乐作品 Logo" />
        </a>
        <div class="header-copy" aria-hidden="true">
          <span class="header-kicker">猫队的收音机</span>
          <span class="header-sub">vvcat の little radio</span>
        </div>
      </div>
    </header>

    <main class="main-stage">
      <section class="radio-scene" aria-label="复古音乐收音机">
        <div class="radio-shadow" aria-hidden="true"></div>

        <div class="radio" id="radio">
          <div class="radio-top">
            <!-- <div class="antenna-mount" aria-hidden="true">
              <span class="antenna-joint"></span>
              <span class="antenna-arm"></span>
              <span class="antenna-tip"></span>
            </div> -->
            <div class="radio-screw screw-left" aria-hidden="true"></div>
            <div class="radio-screw screw-right" aria-hidden="true"></div>
          </div>

          <div class="radio-face">
            <section class="speaker-panel" aria-label="扬声器">
              <div class="speaker-frame">
                <div class="speaker-grille" aria-hidden="true">
                  <svg viewBox="0 0 360 360" role="presentation">
                    <defs>
                      <pattern id="speakerDots" width="22" height="22" patternUnits="userSpaceOnUse">
                        <circle cx="6" cy="6" r="3.1" fill="currentColor" opacity="0.52"></circle>
                        <circle cx="16" cy="16" r="3.1" fill="currentColor" opacity="0.28"></circle>
                      </pattern>
                      <radialGradient id="speakerShade" cx="50%" cy="45%" r="70%">
                        <stop offset="0%" stop-color="#493e31" stop-opacity="0.05" />
                        <stop offset="100%" stop-color="#1f1812" stop-opacity="0.55" />
                      </radialGradient>
                    </defs>
                    <rect x="0" y="0" width="360" height="360" rx="24" fill="url(#speakerDots)"></rect>
                    <rect x="0" y="0" width="360" height="360" rx="24" fill="url(#speakerShade)"></rect>
                  </svg>
                  <div class="speaker-rim" aria-hidden="true"></div>
                </div>
              </div>
              <span class="speaker-label">HAND BUILT / MUSIC</span>
            </section>

            <section class="control-panel" aria-label="播放与音乐列表控制">
              <div class="lcd-bezel">
                <div class="lcd-screen">
                  <div class="lcd-header">
                    <span id="lcdMode">NO MUSIC</span>
                    <span id="trackCounter">00 / 00</span>
                  </div>
                  <div class="lcd-title-row">
                    <span class="lcd-signal" id="lcdSignal" aria-hidden="true"><i></i><i></i><i></i></span>
                    <span class="now-playing-label">NOW PLAYING</span>
                  </div>
                  <div class="playlist" id="playlist" role="listbox" aria-label="音乐作品列表" tabindex="0">
                    <div class="playlist-empty">正在读取音乐作品…</div>
                  </div>
                  <div class="lcd-current" id="lcdCurrent">READY</div>
                </div>
              </div>

              <div class="playback-readout">
                <span id="currentTime">00:00</span>
                <input id="progressRange" class="progress-range" type="range" min="0" max="100" value="0" step="0.1" aria-label="播放进度" />
                <span id="durationTime">00:00</span>
              </div>

              <div class="hardware-row">
                <div class="volume-cluster">
                  <button class="volume-knob" id="volumeKnob" type="button" aria-label="音量旋钮" aria-valuemin="0" aria-valuemax="100" aria-valuenow="75" tabindex="0">
                    <span class="knob-marker"></span>
                  </button>
                  <div class="hardware-caption">VOLUME</div>
                  <div class="volume-value" id="volumeValue">75</div>
                </div>

                <div class="transport-cluster">
                  <div class="transport-buttons">
                    <button class="hardware-button" id="prevBtn" type="button" aria-label="上一首">
                      <span class="button-icon">◀◀</span>
                    </button>
                    <button class="hardware-button play-button" id="playPauseBtn" type="button" aria-label="播放">
                      <span class="button-icon" id="playPauseIcon">▶</span>
                    </button>
                    <button class="hardware-button" id="nextBtn" type="button" aria-label="下一首">
                      <span class="button-icon">▶▶</span>
                    </button>
                  </div>
                  <div class="hardware-caption transport-caption">
                    <span>PREV</span><span>PLAY / PAUSE</span><span>NEXT</span>
                  </div>
                </div>
              </div>

              <div class="radio-status-row">
                <span class="status-led" id="statusLed" aria-hidden="true"></span>
                <span id="statusText">READY · 点击作品开始播放</span>
              </div>
            </section>
          </div>

          <div class="radio-bottom" aria-hidden="true">
            <div class="serial-mark">MR-01</div>
            <div class="bottom-lines"><i></i><i></i><i></i></div>
            <div class="brand-mark">LITTLE<br />RADIO</div>
          </div>
        </div>
      </section>
    </main>

    <aside class="cat-companion" id="catCompanion" aria-label="音乐陪伴小猫">
      <div class="note-cloud" id="noteCloud" aria-hidden="true"></div>
      <div class="cat-bubble" id="catBubble">LISTENING...</div>
      <img id="catImage" src="assets/cat/cat.png" alt="卡通小猫" />
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="grain" aria-hidden="true"></div>
  </div>

  <audio id="audio" preload="metadata"></audio>

  <!-- 内置播放列表兜底：直接双击 index.html（file:// 协议）打开时浏览器禁止 fetch 读取 playlist.json，
       此时使用这里的数据。通过本地服务器访问时仍以 music/playlist.json 为准。 -->
  <script type="application/json" id="embeddedPlaylist">
    [
      { "title": "Summer Sketch · Demo", "file": "demo-summer.wav" },
      { "title": "Midnight Walk · Demo", "file": "demo-midnight.wav" },
      { "title": "After Rain · Demo", "file": "demo-rain.wav" }
    ]
  </script>

  <script src="js/app.js"></script>
</body>
</html>
